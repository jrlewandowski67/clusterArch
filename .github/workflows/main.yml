
name: Build clusterArch macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install blast hmmer
          python3 --version
          command -v blastp
          command -v hmmsearch

      - name: Install additional Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install sortedcontainers bx-python

      - name: Patch legacy clusterTools compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("clusterTools/clusterAnalysis.py")
          if not p.is_file():
              raise SystemExit("Missing clusterTools/clusterAnalysis.py")

          source = p.read_text()
          old = "from sortedcontainers import SortedDict, SortedListWithKey"
          new = "from sortedcontainers import SortedDict, SortedKeyList as SortedListWithKey"

          if old in source:
              p.write_text(source.replace(old, new))
              print("Patched sortedcontainers compatibility")
          elif new in source:
              print("Already patched")
          else:
              print("No legacy sortedcontainers import found")
          PY

      - name: Verify clusterTools imports
        shell: bash
        run: |
          set -euo pipefail
          python -c "from clusterTools import clusterAnalysis; print('clusterAnalysis import OK')"

      - name: Build standalone application
        shell: bash
        run: |
          set -euo pipefail
          bash macos/build.sh

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: clusterArch-macos-arm64
          path: dist/clusterArch-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
